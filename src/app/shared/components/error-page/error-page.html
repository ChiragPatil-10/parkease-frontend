<div class="flex min-h-screen flex-col bg-card">
  @switch (role) {
    @case (Role.Driver) {
      <app-driver-nav [activeTab]="null" />
    }
    @case (Role.Manager) {
      <app-manager-nav [activeTab]="null" />
    }
    @case (Role.Admin) {
      <app-admin-nav [activeTab]="null" />
    }
    @default {
      <header class="border-b border-border bg-card px-4 py-5 md:px-8">
        <span class="font-display text-xl font-bold text-ink">ParkEase</span>
      </header>
    }
  }

  <main class="flex flex-1 items-center justify-center px-4 py-16">
    <div class="flex max-w-md flex-col items-center text-center">
      <p class="font-mono text-xs uppercase tracking-wide text-muted">ERROR {{ code() }}</p>
      <h1 class="mt-3 font-display text-2xl font-bold text-ink">{{ heading() }}</h1>
      <p class="mt-2 text-sm text-muted">{{ message() }}</p>
      <a
        [routerLink]="homeRoute"
        class="mt-5 inline-flex min-h-11 items-center rounded-lg bg-accent px-6 py-2.5 text-sm font-semibold text-ink transition-colors hover:bg-accent-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ink"
      >
        Back to home
      </a>
    </div>
  </main>
</div>
