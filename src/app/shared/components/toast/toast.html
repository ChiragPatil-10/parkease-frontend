@if (visible()) {
  <div
    class="pointer-events-auto flex items-center gap-3 bg-ink px-4 py-3 text-sm text-card max-md:w-full md:rounded-xl"
    data-toast
  >
    <span class="h-2 w-2 shrink-0 rounded-full bg-accent" aria-hidden="true"></span>
    <p class="min-w-0 flex-1">{{ message() }}</p>
    <button
      type="button"
      aria-label="Dismiss"
      (click)="dismissed.emit()"
      class="flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-md text-card transition-colors hover:bg-card/15 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-card"
    >
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        class="h-4 w-4"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>
}
