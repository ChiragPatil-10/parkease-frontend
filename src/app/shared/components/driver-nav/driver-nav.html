<app-nav-shell>
    @for (item of navItems; track item.tab) {
      @if (item.route) {
        <a
          [routerLink]="item.route"
          class="cursor-pointer max-md:flex max-md:min-h-11 max-md:items-center"
          [class.font-semibold]="item.tab === activeTab()"
          [class.text-ink]="item.tab === activeTab()"
          [class.text-muted]="item.tab !== activeTab()"
        >
          {{ item.label }}
        </a>
      } @else {
        <span
          class="cursor-default max-md:flex max-md:min-h-11 max-md:items-center"
          [class.font-semibold]="item.tab === activeTab()"
          [class.text-ink]="item.tab === activeTab()"
          [class.text-muted]="item.tab !== activeTab()"
        >
          {{ item.label }}
        </span>
      }
    }
    <button type="button" class="cursor-pointer text-muted max-md:flex max-md:min-h-11 max-md:items-center" (click)="logOut()">Log out</button>
</app-nav-shell>
