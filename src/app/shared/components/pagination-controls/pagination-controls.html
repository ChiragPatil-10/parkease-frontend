@if (totalPages() > 1) {
  <div class="mt-6 flex items-center justify-center gap-4">
    <button
      type="button"
      (click)="previous()"
      [disabled]="page() <= 1"
      class="rounded-md border border-border px-3 py-1.5 text-sm font-medium text-ink transition-colors hover:bg-card disabled:cursor-not-allowed disabled:opacity-40"
    >
      Previous
    </button>
    <span class="text-sm text-muted">Page {{ page() }} of {{ totalPages() }}</span>
    <button
      type="button"
      (click)="next()"
      [disabled]="page() >= totalPages()"
      class="rounded-md border border-border px-3 py-1.5 text-sm font-medium text-ink transition-colors hover:bg-card disabled:cursor-not-allowed disabled:opacity-40"
    >
      Next
    </button>
  </div>
}
