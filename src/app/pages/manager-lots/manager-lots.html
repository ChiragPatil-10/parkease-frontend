<div class="min-h-screen bg-surface">
  <app-manager-nav activeTab="my-lots" />

  <main class="mx-auto max-w-5xl px-8 py-6">
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-bold text-ink">My Lots</h1>
      <button
        type="button"
        class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-ink transition-colors hover:bg-accent-hover"
      >
        + Add new lot
      </button>
    </div>

    <div class="mt-6 flex flex-col gap-4">
      @for (lot of lots; track lot.id) {
        <article class="flex items-center justify-between gap-6 rounded-xl border border-border bg-card p-5">
          <div class="min-w-0 flex-1">
            <h2 class="text-base font-semibold text-ink">{{ lot.name }}</h2>
            <p class="mt-1 text-sm text-muted">
              @if (lot.status === 'awaiting-approval') {
                Pending admin approval · {{ lot.submittedText }}
              } @else {
                {{ lot.address }} · {{ lot.spotCount }} spots · {{ lot.priceRangeText }}
              }
            </p>
          </div>

          <div class="flex shrink-0 items-center gap-3">
            <span
              class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-medium"
              [class]="statusMeta[lot.status].pillClass"
            >
              <span class="h-1.5 w-1.5 rounded-full" [class]="statusMeta[lot.status].dotClass"></span>
              {{ statusMeta[lot.status].label }}
            </span>

            <button
              type="button"
              class="rounded-lg border border-border px-4 py-1.5 text-sm font-medium text-ink transition-colors hover:bg-surface"
            >
              Edit
            </button>
          </div>
        </article>
      }
    </div>
  </main>
</div>
