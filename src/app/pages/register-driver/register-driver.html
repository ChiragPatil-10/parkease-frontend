<main class="flex min-h-screen items-center justify-center p-4">
  <div class="w-full max-w-[380px] rounded-2xl bg-card p-8 shadow-sm">
    <span class="mb-5 block h-1 w-10 rounded-full bg-accent"></span>

    <h1 class="text-2xl font-bold text-ink">ParkEase</h1>
    <h2 class="mt-1 text-base font-semibold text-ink">Create your driver account</h2>
    <p class="mt-1 text-sm text-muted">Book spots across the city in seconds.</p>

    <form class="mt-6">
      <div>
        <label for="fullName" class="block text-xs font-semibold tracking-wide text-muted"
          >FULL NAME</label
        >
        <input
          id="fullName"
          type="text"
          placeholder="Jordan Lee"
          class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
        />
      </div>

      <div class="mt-5">
        <label for="email" class="block text-xs font-semibold tracking-wide text-muted"
          >EMAIL</label
        >
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
        />
      </div>

      <div class="mt-5">
        <label for="password" class="block text-xs font-semibold tracking-wide text-muted"
          >PASSWORD</label
        >
        <input
          id="password"
          type="password"
          class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
        />
      </div>

      <div class="mt-5">
        <label for="phone" class="block text-xs font-semibold tracking-wide text-muted"
          >PHONE (OPTIONAL)</label
        >
        <input
          id="phone"
          type="tel"
          placeholder="+91 98765 43210"
          class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
        />
      </div>

      <button
        type="submit"
        title="Coming soon"
        (click)="$event.preventDefault()"
        class="mt-6 w-full rounded-lg bg-accent py-2.5 text-sm font-semibold text-ink transition-colors hover:bg-accent-hover"
      >
        Create account
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-muted">
      Already have an account?
      <a routerLink="/" class="text-link hover:underline">Log in</a>
    </p>
  </div>
</main>
