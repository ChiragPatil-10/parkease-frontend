<div class="min-h-screen bg-surface">
  <p class="px-8 pt-4 text-xs font-semibold tracking-wider text-muted">
    MANAGER — CREATE / EDIT LOT
  </p>

  <app-manager-nav activeTab="my-lots" />

  <main class="flex justify-center px-4 py-10">
    <div class="w-full max-w-xl rounded-2xl bg-card p-8 shadow-sm">
      <h1 class="text-xl font-bold text-ink">{{ heading }}</h1>
      <p class="mt-1 text-sm text-muted">
        We'll geocode the address automatically — no need to enter coordinates.
      </p>

      <form class="mt-6" (ngSubmit)="onSave()">
        <div>
          <label for="lotName" class="block text-xs font-semibold tracking-wide text-muted"
            >LOT NAME</label
          >
          <input
            id="lotName"
            type="text"
            name="lotName"
            placeholder="e.g. Whitefield Central Lot"
            [(ngModel)]="lot.lotName"
            class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
          />
        </div>

        <div class="mt-5">
          <label for="address" class="block text-xs font-semibold tracking-wide text-muted"
            >ADDRESS</label
          >
          <input
            id="address"
            type="text"
            name="address"
            placeholder="e.g. 2nd Cross, ITPL Main Rd"
            [(ngModel)]="lot.address"
            class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
          />
        </div>

        <div class="mt-5 grid grid-cols-2 gap-4">
          <div>
            <label for="city" class="block text-xs font-semibold tracking-wide text-muted"
              >CITY</label
            >
            <input
              id="city"
              type="text"
              name="city"
              placeholder="e.g. Bengaluru"
              [(ngModel)]="lot.city"
              class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
            />
          </div>
          <div>
            <label for="totalSpots" class="block text-xs font-semibold tracking-wide text-muted"
              >TOTAL SPOTS</label
            >
            <input
              id="totalSpots"
              type="number"
              name="totalSpots"
              placeholder="e.g. 40"
              [(ngModel)]="lot.totalSpots"
              class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
            />
          </div>
        </div>

        <div class="mt-5 grid grid-cols-2 gap-4">
          <div>
            <label for="minPrice" class="block text-xs font-semibold tracking-wide text-muted"
              >MIN PRICE / HOUR</label
            >
            <input
              id="minPrice"
              type="text"
              name="minPrice"
              placeholder="e.g. ₹30"
              [(ngModel)]="lot.minPricePerHour"
              class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
            />
          </div>
          <div>
            <label for="maxPrice" class="block text-xs font-semibold tracking-wide text-muted"
              >MAX PRICE / HOUR</label
            >
            <input
              id="maxPrice"
              type="text"
              name="maxPrice"
              placeholder="e.g. ₹60"
              [(ngModel)]="lot.maxPricePerHour"
              class="mt-2 w-full rounded-lg border border-red-300 bg-red-50 px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
            />
          </div>
        </div>

        <div class="mt-5 grid grid-cols-2 gap-4">
          <div>
            <label for="openTime" class="block text-xs font-semibold tracking-wide text-muted"
              >OPEN TIME</label
            >
            <input
              id="openTime"
              type="text"
              name="openTime"
              placeholder="e.g. 06:00 AM"
              [(ngModel)]="lot.openTime"
              class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
            />
          </div>
          <div>
            <label for="closeTime" class="block text-xs font-semibold tracking-wide text-muted"
              >CLOSE TIME</label
            >
            <input
              id="closeTime"
              type="text"
              name="closeTime"
              placeholder="e.g. 11:00 PM"
              [(ngModel)]="lot.closeTime"
              class="mt-2 w-full rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
            />
          </div>
        </div>

        <p class="mt-2 text-xs text-red-600">Max price must be greater than or equal to min price</p>

        <div class="mt-5">
          <label for="description" class="block text-xs font-semibold tracking-wide text-muted"
            >DESCRIPTION (OPTIONAL)</label
          >
          <textarea
            id="description"
            name="description"
            rows="3"
            placeholder="Any details drivers should know before booking…"
            [(ngModel)]="lot.description"
            class="mt-2 w-full resize-none rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
          ></textarea>
        </div>

        <div class="mt-6 flex justify-end gap-3">
          <a
            routerLink="/manager/lots"
            class="rounded-lg border border-border px-4 py-2 text-sm font-semibold text-ink transition-colors hover:bg-surface"
          >
            Cancel
          </a>
          <button
            type="submit"
            class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-ink transition-colors hover:bg-accent-hover"
          >
            Save lot
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
