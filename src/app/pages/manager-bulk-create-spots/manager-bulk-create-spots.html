<div class="min-h-screen bg-surface">
  <app-manager-nav activeTab="spots" />

  <main class="flex justify-center px-4 py-10">
    <div class="w-full max-w-3xl rounded-2xl bg-card p-8 shadow-sm">
      <h1 class="text-xl font-bold text-ink">Add spots — {{ lotName }}</h1>
      <p class="mt-1 text-sm text-muted">Add one row per spot, or generate a range at once.</p>

      <div class="mt-6 flex flex-col gap-3">
        @for (row of rows(); track $index) {
          <div class="flex items-start gap-3">
            <span class="pt-2.5 text-sm text-muted">{{ pad($index) }}</span>

            <input
              type="text"
              placeholder="e.g. A-16"
              [value]="row.spotNumber"
              (input)="updateRow($index, 'spotNumber', $any($event.target).value)"
              class="w-28 rounded-lg border border-border px-3 py-2.5 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
            />

            <select
              [value]="row.floor"
              (change)="updateRow($index, 'floor', $any($event.target).value)"
              class="w-28 rounded-lg border border-border px-3 py-2.5 text-sm text-ink focus:border-accent focus:outline-none"
            >
              @for (floor of floorOptions; track floor) {
                <option [value]="floor">{{ floor }}</option>
              }
            </select>

            <select
              [value]="row.spotType"
              (change)="updateRow($index, 'spotType', $any($event.target).value)"
              class="w-32 rounded-lg border border-border px-3 py-2.5 text-sm text-ink focus:border-accent focus:outline-none"
            >
              @for (spotType of spotTypeOptions; track spotType) {
                <option [value]="spotType">{{ spotType }}</option>
              }
            </select>

            <select
              [value]="row.vehicleType"
              (change)="updateRow($index, 'vehicleType', $any($event.target).value)"
              class="w-32 rounded-lg border border-border px-3 py-2.5 text-sm text-ink focus:border-accent focus:outline-none"
            >
              @for (vehicleType of vehicleTypeOptions; track vehicleType) {
                <option [value]="vehicleType">{{ vehicleType }}</option>
              }
            </select>

            <div class="relative w-28">
              <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-sm text-muted"
                >₹</span
              >
              <input
                type="number"
                step="0.01"
                placeholder="40"
                [value]="row.price"
                (input)="updateRow($index, 'price', $any($event.target).value)"
                class="w-full rounded-lg border border-border py-2.5 pl-7 pr-8 text-sm text-ink placeholder:text-muted/70 focus:border-accent focus:outline-none"
              />
              <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-sm text-muted"
                >/hr</span
              >
            </div>
          </div>
        }
      </div>

      <button
        type="button"
        (click)="addRow()"
        class="mt-3 text-sm font-semibold text-link"
      >
        + Add another spot
      </button>

      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          (click)="onCancel()"
          class="rounded-lg border border-border px-4 py-2 text-sm font-semibold text-ink transition-colors hover:bg-surface"
        >
          Cancel
        </button>
        <button
          type="button"
          class="rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-ink transition-colors hover:bg-accent-hover"
        >
          Create {{ rows().length }} spot{{ rows().length === 1 ? '' : 's' }}
        </button>
      </div>
    </div>
  </main>
</div>
